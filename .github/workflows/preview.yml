name: Preview

# Per-PR preview deployments.
#
# On every pull request this:
#   1. runs the test suite (forks included), then
#   2. for same-repo PRs, applies pending D1 migrations to the shared
#      *staging* database, uploads a new version of a separate
#      `build-guild-preview` Worker, and comments its unique preview URL
#      on the PR.
#
# Production is never touched here — that's deploy.yml, on push to main.
#
# Required repository secrets (same as deploy.yml):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# One preview run per PR; a newer push cancels the older, in-flight run.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  preview:
    needs: test
    runs-on: ubuntu-latest
    # Forks can't read the Cloudflare secrets, so skip the deploy for them.
    # (Their PRs still get the `test` job above.)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Bring the shared staging DB up to the PR's schema before the preview
      # Worker runs against it. Forward-only; tracked in d1_migrations.
      - name: Apply D1 migrations to staging (remote)
        run: npx wrangler d1 migrations apply build_guild_preview --remote --env preview

      # Upload a new *version* of the preview Worker. This does not shift any
      # production traffic; it returns a unique preview URL for this version.
      - name: Upload preview version
        id: deploy
        run: |
          set -o pipefail
          npx wrangler versions upload --env preview 2>&1 | tee upload.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- build-guild-preview -->';
            const body = [
              marker,
              '### 🔭 Preview deployment',
              '',
              'This PR is deployed to a preview Worker backed by the **shared staging** D1 database, so it never touches production data:',
              '',
              url
                ? `🔗 **${url}**`
                : '⚠️ Preview URL could not be parsed — check the *Upload preview version* step logs.',
              '',
              `_Commit \`${context.sha.slice(0, 7)}\` · updates on every push. Production is unaffected until this merges to \`main\`._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
