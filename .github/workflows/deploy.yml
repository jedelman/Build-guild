name: Deploy

# Deploys Build Guild to Cloudflare Workers.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#
# Before the first deploy, create the database once and put its id in
# wrangler.jsonc (d1_databases[0].database_id):
#   wrangler d1 create build_guild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Only deploy when the Cloudflare creds are present, so forks/PRs don't fail.
    if: ${{ github.ref == 'refs/heads/main' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply build_guild --remote
      - name: Deploy Worker
        run: npx wrangler deploy
