name: Staging

# A single PERSISTENT environment with a STABLE url:
#   Worker:   build-guild-staging        (build-guild-staging.<subdomain>.workers.dev)
#   Database: build_guild_staging
#
# Why persistent: atproto OAuth's client_id is `${origin}/client-metadata.json`
# and the service-auth identity is `did:web:${host}`, so a STABLE domain is what
# makes login (and Stripe return URLs / webhooks) work reliably — unlike the
# per-PR ephemeral previews whose urls change. Secrets are set once (injected from
# the repo Actions secret on every deploy). Not torn down.
#
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# and (optional) STRIPE_SECRET_KEY for payments.

on:
  push:
    branches: [main, claude/governance-research] # feature branch is temporary; drop after merge
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'jedelman/Build-guild' }} # main repo only (forks lack the secrets)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Sanitize Cloudflare API token
        run: |
          t="${CLOUDFLARE_API_TOKEN}"
          t="${t#Bearer }"; t="${t#\"}"; t="${t%\"}"; t="${t#\'}"; t="${t%\'}"
          t="$(printf '%s' "$t" | tr -d '[:space:]')"
          echo "::add-mask::$t"
          echo "CLOUDFLARE_API_TOKEN=$t" >> "$GITHUB_ENV"

      - name: Provision the staging database + config
        id: provision
        run: |
          set -euo pipefail
          WORKER_NAME="build-guild-staging"
          DB_NAME="build_guild_staging"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          DB_ID="$(curl -fsS "${API}/d1/database?name=${DB_NAME}" -H "$AUTH" | jq -r '.result[0].uuid // empty')"
          NEW_DB=0
          if [ -z "$DB_ID" ]; then
            echo "Creating database $DB_NAME"
            curl -fsS -X POST "${API}/d1/database" -H "$AUTH" -H 'Content-Type: application/json' \
              --data "{\"name\":\"${DB_NAME}\"}" > create.json
            DB_ID="$(jq -r '.result.uuid' create.json)"
            NEW_DB=1
          fi
          [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ] || { echo "Could not resolve database id"; exit 1; }
          echo "Database $DB_NAME -> $DB_ID (new=$NEW_DB)"

          COMPAT_DATE="$(grep compatibility_date wrangler.jsonc | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')"
          sed -e "s|\${WORKER_NAME}|$WORKER_NAME|g" \
              -e "s|\${DB_NAME}|$DB_NAME|g" \
              -e "s|\${DB_ID}|$DB_ID|g" \
              -e "s|\${COMPAT_DATE}|$COMPAT_DATE|g" \
              .github/preview/wrangler.template.jsonc > wrangler.ci.jsonc
          echo "new_db=$NEW_DB" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        run: npx wrangler d1 migrations apply build_guild_staging --remote --config wrangler.ci.jsonc

      - name: Seed sample data (first creation only)
        if: ${{ steps.provision.outputs.new_db == '1' }}
        run: npx wrangler d1 execute build_guild_staging --remote --file seed.sql --config wrangler.ci.jsonc

      - name: Deploy staging Worker
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.ci.jsonc 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n1)"
          echo "### Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Stripe secret on staging
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        if: ${{ env.STRIPE_SECRET_KEY != '' }}
        run: printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --config wrangler.ci.jsonc
