<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#18131f"/>
      <stop offset="60%" stop-color="#0b0a0f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecd49a"/>
      <stop offset="100%" stop-color="#d8b15a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#251f30"/>
  <line x1="80" y1="120" x2="420" y2="120" stroke="#6f5727" stroke-width="2"/>
  <g transform="translate(120 110) rotate(45)">
    <rect x="-34" y="-34" width="68" height="68" rx="12" fill="none" stroke="#d8b15a" stroke-width="5"/>
    <rect x="-16" y="-16" width="32" height="32" rx="6" fill="url(#gold)"/>
  </g>
  <text x="190" y="128" font-size="40" font-weight="700" letter-spacing="1" fill="#ecd49a" font-family="'Cinzel', serif">BUILD GUILD</text>
  <text x="80" y="300" font-size="76" font-weight="700" fill="#f4f1ea">Don't job-hunt alone.</text>
  <text x="80" y="372" font-size="36" fill="#bbb4c6">Form a suitably diverse guild. Combine your skill-peaks.</text>
  <text x="80" y="424" font-size="36" fill="#bbb4c6">Skill strength is what your peers vouch for.</text>
  <g transform="translate(80 500)">
    <rect width="270" height="58" rx="10" fill="url(#gold)"/>
    <text x="135" y="38" font-size="25" font-weight="600" fill="#1a1304" text-anchor="middle">Log in with Bluesky</text>
    <text x="298" y="38" font-size="26" fill="#67bcb3">🦋 built on atproto</text>
  </g>
</svg>
