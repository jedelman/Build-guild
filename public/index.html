<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build Guild — mutual aid for builders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="crest">⚔️</span>
        <div>
          <h1>Build Guild</h1>
          <p class="sub">Don't job-hunt alone. Team up and combine your skill-peaks.</p>
        </div>
      </div>
      <div class="playing-as" id="authbar"></div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="guilds">Guild Hall</button>
      <button class="tab" data-view="roster">Roster</button>
      <button class="tab" data-view="enlist">Enlist</button>
    </nav>

    <main id="app"></main>

    <div id="drawer" class="drawer hidden">
      <div class="drawer-panel">
        <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
        <div id="drawer-body"></div>
      </div>
    </div>

    <footer class="foot">
      Built from
      <a
        href="https://bsky.app/profile/codewright.bsky.social/post/3mmyav5klfc2l"
        target="_blank"
        rel="noopener"
        >this Bluesky thread</a
      >
      · "100% like an MMORPG guild."
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
