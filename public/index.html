<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0a0f" />
    <meta
      name="description"
      content="Build Guild — don't job-hunt alone. Publish your character sheet, form a suitably diverse guild, and combine your skill-peaks."
    />
    <title>Build Guild — mutual aid for builders</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Build Guild — don't job-hunt alone" />
    <meta
      property="og:description"
      content="Publish your character sheet, form a suitably diverse guild, and combine your skill-peaks. Skill strength is what peers vouch for."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="sigil" aria-hidden="true"></span>
        <div>
          <h1>Build Guild</h1>
          <p class="sub">Don't job-hunt alone. Team up and combine your skill-peaks.</p>
        </div>
      </div>
      <div class="playing-as" id="authbar"></div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="guilds" aria-selected="true">Guild Hall</button>
      <button class="tab" data-view="roster" aria-selected="false" tabindex="-1">Roster</button>
      <button class="tab" data-view="quests" aria-selected="false" tabindex="-1">Quest Board</button>
      <button class="tab" data-view="enlist" aria-selected="false" tabindex="-1">Enlist</button>
    </nav>

    <main id="app"></main>

    <div id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Details">
      <div class="drawer-panel">
        <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
        <div id="drawer-body"></div>
      </div>
    </div>

    <footer class="foot">
      Built from
      <a
        href="https://bsky.app/profile/codewright.bsky.social/post/3mmyav5klfc2l"
        target="_blank"
        rel="noopener"
        >this Bluesky thread</a
      >
      · "100% like an MMORPG guild."
      · <button type="button" id="report-bug" class="linklike">Report a bug</button>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
